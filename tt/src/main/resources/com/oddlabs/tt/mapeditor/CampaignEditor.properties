# Trigger templates
template_opening=Opening story
template_opening_help=When the level starts: a dialog tells the story, then the objective is set. Write your own words in both.
template_opening_header=A new land
template_opening_text=Our scouts have found an island across the sea. Take it before our enemies do.
template_opening_objective=Build up your tribe and drive the enemy from the island.
template_victory=Win when every enemy is beaten
template_victory_help=Wins the level once every tribe on another team than player 1 has no units left. A new level starts with this one.
template_protect=Lose if something is destroyed
template_protect_help=Loses the level when a unit or building is killed or destroyed: pick the chieftain to protect, a building to defend, or a captive to keep alive.
template_protect_text=What you were sworn to protect is lost.
template_waves=Attack waves
template_waves_help=Every few minutes, new warriors appear for an enemy tribe and attack player 1. Pick the area they appear in; change the time, the tribe and how many come.
template_reinforcements=Reinforcements arrive
template_reinforcements_help=When player 1 reaches an area, new units join them there. Pick the area in both the condition and the action.
template_reinforcements_text=Reinforcements have arrived!
template_allies=Guards join your side
template_allies_help=When player 1 comes near a unit or building, its tribe (player 3 here) joins player 1''s team, after a dialog. Give that tribe its own team in Players... so it starts as an enemy.
template_allies_header=Friends at last
template_allies_text=We have watched you fight. Our spears are yours.
template_betrayal=An ally turns
template_betrayal_help=After some minutes, a friendly tribe (player 3 here) moves to another team and attacks player 1. Start that tribe on player 1''s team in Players...
template_betrayal_text=Treachery! Our allies have turned against us!
template_captives=Free the captives
template_captives_help=When player 1 reaches the area, the units of the captive tribe (player 3 here, best made neutral) in it join player 1.
template_captives_text=The captives are free and join your tribe.
template_statues_guard=Lose when the statues are gone
template_statues_guard_help=Loses the level once no golden statue is left: pick an area to watch only the statues in it, or leave it empty for the whole island.
template_statues_text=The golden statues have been carried off.
template_statues_raid=Raiders carry off statues
template_statues_raid_help=Whenever enough units of an enemy tribe stand in an area, the golden statues there are carried off. Pick the area in both the condition and the action.
template_raid_text=Raiders have carried off golden statues!
template_garrison=Man a tower or ship
template_garrison_help=When the level starts, units of a tribe in an area walk into a tower or aboard a ship of their tribe. Pick the area and the building.
template_landing=Troops land from a ship
template_landing_help=After a while, warriors come ashore from a ship and attack player 1. Pick the ship; it must lie by land. Units it lacks are made.
