# Conditions
condition_game_started=Level starts
condition_time=Time passes
condition_units_in_area=Units enter an area
condition_units_near_object=Units come near a unit or building
condition_object_destroyed=Unit or building destroyed
condition_player_eliminated=Player eliminated
condition_enemies_defeated=All enemies defeated
condition_units_below=Player has fewer units than
condition_supplies_gathered=Supplies gathered
condition_magic_used=Chieftain casts a spell in an area
help_game_started=Holds as soon as the level starts. Use it for the opening story and setup.
help_time_elapsed=Holds after this many seconds of game time from when the trigger became active. With Repeat on, it holds again every so many seconds, as for waves of attacks.
help_units_in_area=Holds when the player has at least this many units of the kind inside the area.
help_units_near_object=Holds when any unit of the player, of the kind, comes within the radius of the unit or building, as when guards spot the player.
help_object_destroyed=Holds when the unit or building is killed, destroyed or taken away.
help_player_eliminated=Holds when the player has no units and no chieftain left.
help_enemies_defeated=Holds when every tribe that is an enemy of the player (on another team) has no units and no chieftain left.
help_units_below=Holds when the player has fewer units of the kind than the count. Any units counts those in buildings too; a kind counts only those out on the island.
help_supplies_gathered=Holds when the player has this many of the supply stocked in their quarters and armory.
help_magic_used=Holds when the chieftain of the player finishes casting the spell inside the area.
condition_statues_left=Golden statues left
condition_units_inside=Units in a tower or ship
help_statues_left=Holds when fewer golden statues than the count are left in the area, or on the whole island when no area is chosen. Set the count to 1 for "every statue is gone".
help_units_inside=Holds when the tower or ship has at least this many units inside it. A tower holds one.
condition_object_in_area=Unit or building in an area
condition_units_fewer_in_area=Fewer units in an area
help_object_in_area=Holds when the unit, building or golden statue stands inside the area, whoever owns it now, as a carried flag reaching home.
help_units_fewer_in_area=Holds when the player has fewer units of the kind than the count inside the area. Set the count to 1 for "none left", as when a hill is left or cleared.

# Actions
action_dialog=Show a dialog
action_objective=Change the objective
action_message=Show a message
action_wait=Wait
action_camera=Move the camera to an area
action_spawn=Spawn units in an area
action_attack_area=Attack an area
action_attack_player=Attack a player
action_deploy=Send units out of the armory
action_refill_armory=Refill the armory
action_reinforcements=Replace lost units from the armory
action_change_owner_area=Hand over units in an area
action_change_owner_object=Hand over a unit
action_remove_object=Remove a unit or building
action_set_ai=Change a tribe''s behaviour
action_activate=Activate a trigger
action_deactivate=Deactivate a trigger
action_victory=Win the level
action_defeat=Lose the level
help_dialog=Shows a story dialog with a header, text and an optional portrait, and pauses the game while it is open. The next actions wait until it is closed.
help_objective=Changes the objective shown in the game menu and tells the player about it.
help_message=Prints a line of text on the screen, like a game notice.
help_wait=Waits this many seconds of game time before the next action.
help_camera_jump=Flies the camera to the area. The next actions wait until it gets there.
help_spawn_units=Puts new units for the player in the area, as many as the tribe has room for.
help_attack_area=Sends up to this many of the warriors of the player, of the kind, to attack the area. Only warriors fight.
help_attack_player=Sends up to this many of the warriors of the player, of the kind, at the armory of the target player, else the quarters, else the chieftain, else any unit.
help_deploy=Sends this many units of the kind out of the armory of the player.
help_refill_armory=Moves the units of the player in the quarters to the armory and stocks it with iron weapons, so it can send out warriors.
help_reinforcements=From now on, the armory of the player sends out a new unit of the kind for each unit the player loses, while it has units.
help_change_owner_area=Hands every unit of the player, of the kind, inside the area to the new owner, as freed captives join the player. Chieftains stay.
help_change_owner_object=Hands the unit to the new owner.
help_remove_object=Takes the unit away, or destroys the building.
help_set_ai=Changes how the computer runs the tribe: an opponent plays as well as the campaign difficulty, a passive tribe only attacks when sent, a neutral one stays put.
help_activate_trigger=Starts the trigger watching for its condition, if it is not already.
help_deactivate_trigger=Stops the trigger from watching for its condition.
help_victory=Wins the level, marks it won and opens the next level of the campaign.
help_defeat=Loses the level with the message as the reason.
action_set_team=Change a tribe''s team
action_enter_building=A unit enters a tower or ship
action_board_from_area=Units in an area enter a tower or ship
action_leave_building=Units leave a tower or ship
action_deploy_from=Send units out of a building
action_spawn_statues=Place golden statues in an area
action_remove_statues=Take the golden statues in an area
help_set_team=Moves the tribe to the team. Tribes on the same team are friends, others are enemies, so this turns guards into allies or friends into traitors at once. Works on player 1 too.
help_enter_building=The unit walks into the tower or aboard the ship. Both must belong to the same tribe; a tower takes one warrior.
help_board_from_area=Up to this many units of the player, of the kind, inside the area walk into the tower or aboard the ship of the same tribe. A tower takes one warrior.
help_leave_building=The guard comes down from the tower, or everyone aboard the ship goes ashore. A ship must lie by land to set its units ashore.
help_deploy_from=Sends this many units of the kind out of the building, making those it lacks while the tribe has room. Quarters send out peons, an armory or a ship the kind chosen, and a tower its guard.
help_spawn_statues=Sets this many golden statues down at random free spots in the area. Golden statues belong to no one and stand in the way.
help_remove_statues=Takes away every golden statue in the area, as raiders carry them off; with no area chosen, every statue on the island.
action_remove_units=Take units away
action_kill_units=Kill units
help_remove_units=Takes the units of the player, of the kind, inside the area away at once, as if they sailed off; with no area chosen, all over the island. Units in towers and ships stay.
help_kill_units=Kills the units of the player, of the kind, inside the area; with no area chosen, all over the island. Units in towers and ships stay.

